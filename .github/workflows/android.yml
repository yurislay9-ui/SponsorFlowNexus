# GitHub Actions Workflow - Android CI/CD
# Compila el APK automáticamente

name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      
    steps:
      # 1. Checkout del código
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
      
      # 3. Configurar Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      # 4. Build APK
      - name: Build Debug APK
        run: |
          cd WhatsApp
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      
      # 5. Verificar que el APK se generó
      - name: Verify APK exists
        run: |
          ls -la WhatsApp/app/build/outputs/apk/debug/
      
      # 6. Subir APK como artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: WhatsApp/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: *.apk
          name: Nexus Release
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
