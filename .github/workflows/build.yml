name: Crear APK (Detección automática de ZIP)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL del archivo ZIP con el proyecto'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # Gestión automática y optimizada de caché

      - name: Setup project from ZIP (if URL provided)
        if: ${{ github.event.inputs.zip_url != '' }}
        run: |
          echo "Downloading ZIP from: ${{ github.event.inputs.zip_url }}"
          curl -L -o project.zip "${{ github.event.inputs.zip_url }}"
          mkdir -p zip_extracted
          unzip -q project.zip -d zip_extracted

          PROJECT_ROOT=$(find zip_extracted -maxdepth 3 \
            \( -name 'gradlew' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -printf '%h\n' | sort | head -n 1)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Could not find Android project root inside ZIP."
            exit 1
          fi

          rsync -a --exclude='.git' "$PROJECT_ROOT/" ./
          rm -rf project.zip zip_extracted # Liberar I/O y espacio inmediatamente

      - name: Validate project structure
        run: |
          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found in workspace root."
            exit 1
          fi
          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle(.kts) not found."
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Gradle CI Environment
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --parallel --build-cache

      - name: Locate APK files after build
        if: always()
        run: |
          find app/build/outputs/apk -name '*.apk' -type f 2>/dev/null | while read f; do
            echo "Found APK: $f (size: $(du -sh "$f" | cut -f1))"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SponsorFlowNexus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 3
