# GitHub Actions Workflow - Android CI/CD
# Compila el APK automáticamente

name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout del código
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Configurar Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      # 3. Configurar Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
      
      # 4. Crear archivo local.properties
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      
      # 5. Construir APK Debug
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      
      # 6. Verificar que el APK se generó
      - name: Verify APK exists
        run: |
          ls -la app/build/outputs/apk/debug/
      
      # 7. Subir APK como artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      # 8. (Opcional) Subir a Firebase/App Distribution
      # Descomenta si tienes tokens configurados
      # - name: Upload to Firebase App Distribution
      #   if: github.event_name == 'push'
      #   run: |
      #     echo "Firebase upload configured"

  # Job para análisis de código
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Run Detekt (análisis estático)
        run: |
          chmod +x gradlew
          ./gradlew detekt --no-daemon
        continue-on-error: true
      
      - name: Upload Detekt Reports
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/
        continue-on-error: true

  # Job para tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Run Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
      
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/

  # Job para crear Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: *.apk
          name: Nexus Release v${{ github.run_number }}
          draft: true
          prerelease: ${{ github.ref != 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
