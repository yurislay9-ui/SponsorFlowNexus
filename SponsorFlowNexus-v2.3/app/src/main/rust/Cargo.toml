[package]
name = "nexus_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "nexus_rust"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
aes-gcm = "0.10"
argon2 = "0.5"
blake3 = "1.5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true