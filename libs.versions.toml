[versions]
composeCompiler = "1.5.10"
androidxTestExtJunit = "1.1.5"
androidxTest = "1.1.5"
agp = "8.2.2"
kotlin = "1.9.22"
ksp = "1.9.22-1.0.17"
hilt = "2.50"
compose = "2024.02.02"
retrofit = "2.11.0"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-compiler = { module = "androidx.compose:compose-compiler", version.ref = "composeCompiler" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test = { module = "androidx.test:core", version.ref = "androidxTest" }
android-application = { module = "com.android.tools.build:gradle", version.ref = "agp" }
android-library = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
kotlin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

[bundles]
androidx-compose = [
    "androidx-compose-bom",
    "compose-compiler",
    "androidx-test-ext-junit",
    "androidx-test"
]